<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boss Fight</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">✦</span>
          <span>Boss Fight</span>
        </div>

        <div class="hud">
          <div class="stat-box">
            <span class="label">Score</span>
            <span id="score">0</span>
          </div>
          <div class="stat-box">
            <span class="label">Health</span>
            <span id="health">100</span>
          </div>
        </div>
      </header>

      <main class="game-panel">
        <canvas id="gameCanvas" width="960" height="600" aria-label="Boss Fight game area"></canvas>

        <div id="overlay" class="overlay visible">
          <div class="panel">
            <h1>Boss Fight</h1>
            <p>Defend your ship from incoming enemy waves.</p>
            <button id="startButton">Start Game</button>
          </div>
        </div>
      </main>
    </div>

    <script src="game.js"></script>
  </body>
</html>
